name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-14, clang-18]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test CC=${{ matrix.cc }} CFLAGS="-O2 -Werror" JOBS="$(nproc)"
